name: shared-kv-pool

support:
  engines: {vllm: vLLM}
  accelerators:
    gpu:
      label: NVIDIA GPU
      notes: "Default. Any NVIDIA GPU that serves Qwen3-8B · 2 replicas × 1 GPU on one node · `INFRA_PROVIDER`: `base`, `ocp`"
      model: Qwen/Qwen3-8B
      providers:
        - {name: base, label: "Kubernetes (base)"}
        - {name: ocp, label: "OpenShift"}
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: shared-kv-pool
    NAMESPACE: llm-d-shared-kv-pool

    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: gpu, values: [gpu]}
    MODEL_SERVER: {default: vllm, values: [vllm]}
    INFRA_PROVIDER: {default: base, values: [base, ocp]}

    MODEL: {default: "Qwen/Qwen3-8B"}
    # Must match KV_POOL_NAME in pool-manager/base/daemonset.yaml and the model
    # server overlay.
    KV_POOL_NAME: {default: qwen3-8b}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}
  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -
  openshift_scc:
    - when: {INFRA_PROVIDER: [ocp]}
      skip_in: [ci]
      run: |
        # The pool is a hostPath on node tmpfs, which carries no container
        # SELinux label: let the pool manager and the model servers run as
        # spc_t (cluster-admin).
        oc adm policy add-scc-to-user privileged -z ${GUIDE_NAME}-kv-pool-manager -n ${NAMESPACE}
        oc adm policy add-scc-to-user privileged -z ${GUIDE_NAME}-gpu-vllm-sa -n ${NAMESPACE}

deploy:
  pool_manager:
    - run: |
        # One pool manager per GPU node publishes the node's pool before any
        # model server attaches to it.
        kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/pool-manager/${INFRA_PROVIDER}/
        kubectl rollout status -n ${NAMESPACE} daemonset/${GUIDE_NAME}-kv-pool-manager --timeout=300s
  router_values:
    - run: |
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml"
  monitoring_values:
    - when: {MONITORING: ["true"]}
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"
  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}
  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}/
  monitoring:
    - when: {MONITORING: ["true"]}
      run: kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    pool:
      - run: |
          # Each node's pool is published, READY, and attached by its model servers
          for POOL_POD in $(kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/component=kv-pool-manager -o jsonpath='{.items[*].metadata.name}'); do
            kubectl exec -n ${NAMESPACE} ${POOL_POD} -- \
              python3 /opt/kv-pool-manager/kv_pool_manager.py status --name ${KV_POOL_NAME}
          done
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"How are you today?\"}"'
    cross_replica:
      - run: |
          # Prime a ~4k-token prefix on one replica, then send the same prompt
          # straight to the other one: it loads the blocks from the pool
          # instead of recomputing them (external prefix-cache hits rise).
          # Two model servers on one node, as "<podIP> <podIP>"
          read A B <<<"$(kubectl get pods -n ${NAMESPACE} -l llm-d.ai/guide=${GUIDE_NAME},llm-d.ai/role=decode \
            -o jsonpath='{range .items[*]}{.status.hostIP} {.status.podIP}{"\n"}{end}' \
            | sort | awk '$1 == h {print p, $2; exit} {h = $1; p = $2}')"
          test -n "${B}" || { echo "FAIL: no two model servers share a node"; exit 1; }
          kubectl run pool-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="A=${A}" --env="B=${B}" --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'P=$(for i in $(seq 1 200); do printf "A shared KV pool lets every replica on a node reuse a prefix. "; done)
              hits() { curl -sS "http://$1:8000/metrics" | awk "/^vllm:external_prefix_cache_hits_total/ {s += \$NF} END {print s + 0}"; }
              curl -sS -o /dev/null -X POST "http://${A}:8000/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P}\", \"max_tokens\": 1}"
              sleep 2
              BEFORE=$(hits ${B})
              curl -sS -o /dev/null -X POST "http://${B}:8000/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"${P}\", \"max_tokens\": 1}"
              AFTER=$(hits ${B})
              echo "replica B external prefix-cache hits: ${BEFORE} -> ${AFTER}"
              test "${AFTER}" != "${BEFORE}" || { echo "FAIL: replica B did not load the prefix from the pool"; exit 1; }'

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/${INFRA_PROVIDER}
  pool:
    - run: |
        # Destroy each node's pool generation, then the managers. Destroy
        # refuses (exit code 3) while a model server is still attached, so
        # wait for the model servers to terminate first.
        kubectl wait -n ${NAMESPACE} --for=delete pod -l llm-d.ai/guide=${GUIDE_NAME},llm-d.ai/role=decode --timeout=180s
        for POOL_POD in $(kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/component=kv-pool-manager -o jsonpath='{.items[*].metadata.name}'); do
          GENERATION=$(kubectl exec -n ${NAMESPACE} ${POOL_POD} -- cat /kv-pool/.${KV_POOL_NAME}.ready)
          kubectl exec -n ${NAMESPACE} ${POOL_POD} -- \
            python3 /opt/kv-pool-manager/kv_pool_manager.py destroy --name ${KV_POOL_NAME} --generation ${GENERATION}
        done
        kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/${GUIDE_NAME}/pool-manager/${INFRA_PROVIDER}/
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/recipes/modelserver/components/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
