apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenShift: the pool is a hostPath on the node's tmpfs, which carries no
# container SELinux label, so the manager runs as spc_t. That needs an SCC
# that allows it, such as privileged, granted to this service account
# (see the README).
resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kv-pool-manager
      spec:
        template:
          spec:
            securityContext:
              seLinuxOptions:
                type: spc_t
