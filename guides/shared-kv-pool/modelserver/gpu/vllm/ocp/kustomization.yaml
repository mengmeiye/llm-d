apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OpenShift: hostPath volumes need an SCC that allows them, such as
# hostmount-anyuid, granted to the model server service account
# (see the README). SELinux nodes also need the pool directory labelled
# container_file_t, which the kv-pool-manager's hostPath creates.
resources:
  - ../base
