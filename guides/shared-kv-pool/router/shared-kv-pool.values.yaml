## shared-kv-pool guide overrides for the router.
## Layer on top of: recipes/router/base.values.yaml
##
## Precise prefix-cache routing over replicas that share one KV pool per node.
## The `storage` tier is the vLLM filesystem tier on the node's pool, so it is
## marked `shared: node`: its blocks are indexed under the node rather than
## under the replica that wrote them. A block written by any replica on a node
## counts for every replica on that node, stays indexed when its writer is
## deleted, and counts for a replica added to the node before it serves a
## request.

router:
  epp:
    replicas: 1
    # The `shared` field of kvCacheBackendConfigs needs a router build that
    # supports shared tiers. Set the tag (or registry/repository) to that build.
    image:
      tag: main
      pullPolicy: Always
    flags:
      ha-enable-leader-election: false
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: llm-d-hf-token
            key: HF_TOKEN

    pluginsConfigFile: "shared-kv-pool-plugins.yaml"
    pluginsCustomConfig:
      shared-kv-pool-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              modelName: Qwen/Qwen3-8B
              vllm:
                endpointDiscovery:
                  attemptTimeout: 2s
          - type: endpoint-notification-source
          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64
                hashAlgorithm: xxh64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
                  inMemoryConfig:
                    # Entries per block across replicas and tiers. Shared-tier
                    # blocks take one entry per node, not one per replica.
                    podCacheSize: 16
                kvCacheBackendConfigs:
                  - {name: gpu, weight: 1.0}
                  - {name: cpu, weight: 0.8}
                  # Loading from the node pool costs a copy into the
                  # replica's CPU tier before the GPU load.
                  - {name: storage, weight: 0.6, shared: node}
              kvEventsConfig:
                engineType: "vllm"
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  replaySocketPort: 5559
          - type: prefix-cache-scorer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: max-score-picker
        dataLayer:
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-scorer
                weight: 3
              - pluginRef: queue-scorer
                weight: 1
              - pluginRef: kv-cache-utilization-scorer
                weight: 1
              - pluginRef: max-score-picker

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    type: vllm
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "shared-kv-pool"
